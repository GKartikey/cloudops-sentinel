# CloudOps Sentinel - Simulated Cloud Resource Inventory
# ---------------------------------------------------------------------------
# This file stands in for the output of `az resource list` / `aws resourcegroups
# taggingapi get-resources`. It lets the whole platform be exercised locally with
# zero cloud spend. Each resource carries:
#   spec    -> the provisioned capacity we are billed for
#   config  -> security / reliability posture flags the auditors read
#   profile -> how the synthetic telemetry generator behaves for this resource
#   source  -> "simulated" (generated) or "live" (scraped from a real container)
#
# Replacing this file with a real exporter is the only change needed to point
# CloudOps Sentinel at a genuine subscription/account. See docs/ARCHITECTURE.md.

version: 1

subscriptions:
  - id: azure-sub-0e41
    provider: azure
    display_name: "Contoso Platform - Production"
  - id: aws-acct-503412
    provider: aws
    display_name: "contoso-prod (503412007781)"
  - id: local
    provider: docker
    display_name: "Local demo cluster"

resources:

  # ---------------------------------------------------------------- Azure VMs
  - id: azure-vm-web-01
    name: prod-web-01
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-web
    type: virtual_machine
    sku: Standard_D8s_v5
    region: eastus
    environment: prod
    owner: platform-team
    source: simulated
    tags: {app: storefront, tier: web, cost_center: CC-1042}
    spec: {vcpu: 8, memory_gb: 32, disk_gb: 256}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: true
    profile: {kind: steady, cpu: 41, mem: 55, latency_ms: 120, error_rate: 0.004, rps: 180}

  - id: azure-vm-batch-02
    name: prod-batch-02
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-batch
    type: virtual_machine
    sku: Standard_E16s_v5
    region: eastus
    environment: prod
    owner: data-team
    source: simulated
    tags: {app: etl, tier: batch, cost_center: CC-2210}
    spec: {vcpu: 16, memory_gb: 128, disk_gb: 512}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: false          # finding: no health probe on a prod VM
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: true
    # Deliberately over-provisioned: 16 vCPU sitting at ~6% -> rightsizing target
    profile: {kind: idle, cpu: 6, mem: 14, latency_ms: 40, error_rate: 0.001, rps: 4}

  - id: azure-vm-legacy-jump
    name: legacy-jumpbox
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-legacy
    type: virtual_machine
    sku: Standard_D4s_v3
    region: westeurope
    environment: prod
    owner: unassigned
    source: simulated
    tags: {app: legacy, tier: ops}
    spec: {vcpu: 4, memory_gb: 16, disk_gb: 128}
    config:
      public_ip: true              # finding: public IP with management ports open
      encryption_at_rest: false    # finding: unencrypted OS disk
      https_only: false
      health_check: false
      managed_identity: false
      diagnostic_logs: false       # finding: no diagnostic logs
      backup_enabled: false
      open_ports: [22, 3389]
    profile: {kind: idle, cpu: 2, mem: 9, latency_ms: 25, error_rate: 0.0, rps: 0}

  # ------------------------------------------------------- AWS EC2 / EKS nodes
  - id: aws-ec2-api-01
    name: prod-api-01
    provider: aws
    subscription: aws-acct-503412
    resource_group: prod-api
    type: virtual_machine
    sku: m6i.2xlarge
    region: us-east-1
    environment: prod
    owner: payments-team
    source: simulated
    tags: {app: payments, tier: api, cost_center: CC-3301}
    spec: {vcpu: 8, memory_gb: 32, disk_gb: 200}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: true
    profile: {kind: diurnal, cpu: 58, mem: 62, latency_ms: 210, error_rate: 0.011, rps: 340}

  - id: aws-eks-node-a
    name: eks-prod-ng-a
    provider: aws
    subscription: aws-acct-503412
    resource_group: eks-prod
    type: kubernetes_node
    sku: m6i.xlarge
    region: us-east-1
    environment: prod
    owner: platform-team
    source: simulated
    tags: {cluster: eks-prod, nodegroup: general-a}
    spec: {vcpu: 4, memory_gb: 16, disk_gb: 100}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: diurnal, cpu: 47, mem: 68, latency_ms: 90, error_rate: 0.003, rps: 260}

  - id: aws-eks-node-b
    name: eks-prod-ng-b
    provider: aws
    subscription: aws-acct-503412
    resource_group: eks-prod
    type: kubernetes_node
    sku: m6i.xlarge
    region: us-east-1
    environment: prod
    owner: platform-team
    source: simulated
    tags: {cluster: eks-prod, nodegroup: general-b}
    spec: {vcpu: 4, memory_gb: 16, disk_gb: 100}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: steady, cpu: 12, mem: 22, latency_ms: 85, error_rate: 0.002, rps: 45}

  # ------------------------------------------------------------- Live services
  # These three ARE the Docker containers started by docker-compose. Their
  # telemetry is scraped over HTTP, not generated. Everything downstream of the
  # collector treats them identically to the simulated fleet.
  - id: svc-checkout-api
    name: checkout-api
    provider: docker
    subscription: local
    resource_group: cloudops-demo
    type: container_workload
    sku: "0.50 vCPU / 512 MiB"
    region: local
    environment: demo
    owner: payments-team
    source: live
    endpoint: "http://checkout-api:8080"
    tags: {app: checkout, tier: api}
    spec: {vcpu: 0.5, memory_gb: 0.5, disk_gb: 1}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: false
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: live}

  - id: svc-inventory-api
    name: inventory-api
    provider: docker
    subscription: local
    resource_group: cloudops-demo
    type: container_workload
    sku: "0.50 vCPU / 512 MiB"
    region: local
    environment: demo
    owner: catalog-team
    source: live
    endpoint: "http://inventory-api:8080"
    tags: {app: inventory, tier: api}
    spec: {vcpu: 0.5, memory_gb: 0.5, disk_gb: 1}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: false
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: live}

  - id: svc-report-worker
    name: report-worker
    provider: docker
    subscription: local
    resource_group: cloudops-demo
    type: container_workload
    sku: "0.25 vCPU / 256 MiB"
    region: local
    environment: demo
    owner: data-team
    source: live
    endpoint: "http://report-worker:8080"
    tags: {app: reporting, tier: worker}
    spec: {vcpu: 0.25, memory_gb: 0.25, disk_gb: 1}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: false
      health_check: false          # finding: worker ships without a liveness probe
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: live}

  # ------------------------------------------------------------ Managed data
  - id: azure-sql-orders
    name: sql-orders-prod
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-data
    type: managed_database
    sku: GP_Gen5_8
    region: eastus
    environment: prod
    owner: payments-team
    source: simulated
    tags: {app: orders, cost_center: CC-3301}
    spec: {vcpu: 8, memory_gb: 40, disk_gb: 512}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: true
    profile: {kind: diurnal, cpu: 64, mem: 71, latency_ms: 32, error_rate: 0.002, rps: 900}

  - id: aws-rds-analytics
    name: rds-analytics
    provider: aws
    subscription: aws-acct-503412
    resource_group: prod-data
    type: managed_database
    sku: db.r6g.4xlarge
    region: us-east-1
    environment: prod
    owner: data-team
    source: simulated
    tags: {app: analytics, cost_center: CC-2210}
    spec: {vcpu: 16, memory_gb: 128, disk_gb: 2048}
    config:
      public_ip: true              # finding: publicly reachable database
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: false      # finding: static credentials, no IAM auth
      diagnostic_logs: false
      backup_enabled: true
    # Over-provisioned and expensive -> the headline savings recommendation
    profile: {kind: idle, cpu: 9, mem: 21, latency_ms: 48, error_rate: 0.001, rps: 12}

  # ---------------------------------------------------------------- Storage
  - id: azure-blob-archive
    name: stcontosoarchive
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-data
    type: object_storage
    sku: Standard_LRS_Hot
    region: eastus
    environment: prod
    owner: data-team
    source: simulated
    tags: {app: archive}
    spec: {storage_gb: 8400}
    config:
      public_ip: false
      public_access: true          # finding: anonymous blob access enabled
      encryption_at_rest: true
      https_only: false            # finding: HTTP allowed on a storage account
      health_check: true
      managed_identity: true
      diagnostic_logs: false
      backup_enabled: true
      lifecycle_policy: false      # finding: hot tier with no lifecycle rule
    profile: {kind: storage, cpu: 0, mem: 0, latency_ms: 60, error_rate: 0.0005, rps: 30}

  - id: aws-s3-backups
    name: contoso-backups
    provider: aws
    subscription: aws-acct-503412
    resource_group: prod-data
    type: object_storage
    sku: S3_Standard
    region: us-east-1
    environment: prod
    owner: platform-team
    source: simulated
    tags: {app: backups}
    spec: {storage_gb: 3100}
    config:
      public_ip: false
      public_access: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: true
      lifecycle_policy: true
    profile: {kind: storage, cpu: 0, mem: 0, latency_ms: 55, error_rate: 0.0003, rps: 18}

  # ------------------------------------------------------------- Serverless
  - id: azure-func-webhook
    name: func-webhook-relay
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-web
    type: serverless_function
    sku: Consumption_Y1
    region: eastus
    environment: prod
    owner: platform-team
    source: simulated
    tags: {app: webhooks}
    spec: {memory_gb: 0.5, invocations_per_month: 14000000, avg_duration_ms: 220}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: bursty, cpu: 35, mem: 44, latency_ms: 220, error_rate: 0.018, rps: 120}

  - id: aws-lambda-thumbs
    name: lambda-thumbnailer
    provider: aws
    subscription: aws-acct-503412
    resource_group: prod-media
    type: serverless_function
    sku: Lambda_1024MB
    region: us-east-1
    environment: prod
    owner: media-team
    source: simulated
    tags: {app: media}
    spec: {memory_gb: 1.0, invocations_per_month: 2400000, avg_duration_ms: 780}
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: bursty, cpu: 52, mem: 78, latency_ms: 780, error_rate: 0.006, rps: 60}

  # ------------------------------------------------------ Network and orphans
  - id: azure-lb-prod
    name: lb-prod-frontend
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-prod-web
    type: load_balancer
    sku: Standard
    region: eastus
    environment: prod
    owner: platform-team
    source: simulated
    tags: {app: storefront}
    spec: {processed_gb_per_month: 4200}
    config:
      public_ip: true
      encryption_at_rest: true
      https_only: true
      health_check: true
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    profile: {kind: diurnal, cpu: 0, mem: 0, latency_ms: 8, error_rate: 0.002, rps: 520}

  - id: azure-disk-orphan-01
    name: pd-detached-2023
    provider: azure
    subscription: azure-sub-0e41
    resource_group: rg-legacy
    type: managed_disk
    sku: Premium_SSD_P30
    region: westeurope
    environment: prod
    owner: unassigned
    source: simulated
    tags: {}
    spec: {disk_gb: 1024, attached: false}    # finding: orphaned premium disk
    config:
      public_ip: false
      encryption_at_rest: true
      https_only: true
      health_check: false
      managed_identity: false
      diagnostic_logs: false
      backup_enabled: false
    profile: {kind: dead, cpu: 0, mem: 0, latency_ms: 0, error_rate: 0.0, rps: 0}

  - id: aws-eip-orphan-01
    name: eip-unattached-a
    provider: aws
    subscription: aws-acct-503412
    resource_group: prod-api
    type: public_ip
    sku: ElasticIP
    region: us-east-1
    environment: prod
    owner: unassigned
    source: simulated
    tags: {}
    spec: {attached: false}                   # finding: unattached elastic IP
    config:
      public_ip: true
      encryption_at_rest: true
      https_only: true
      health_check: false
      managed_identity: false
      diagnostic_logs: false
      backup_enabled: false
    profile: {kind: dead, cpu: 0, mem: 0, latency_ms: 0, error_rate: 0.0, rps: 0}

  - id: aws-ec2-staging-idle
    name: staging-runner-03
    provider: aws
    subscription: aws-acct-503412
    resource_group: staging
    type: virtual_machine
    sku: c6i.4xlarge
    region: us-east-1
    environment: staging
    owner: qa-team
    source: simulated
    tags: {app: ci-runner, tier: build}
    spec: {vcpu: 16, memory_gb: 32, disk_gb: 300}
    config:
      public_ip: true
      encryption_at_rest: true
      https_only: true
      health_check: false
      managed_identity: true
      diagnostic_logs: true
      backup_enabled: false
    # Runs 24/7 for a workload that is idle outside business hours -> schedule it
    profile: {kind: idle, cpu: 4, mem: 11, latency_ms: 30, error_rate: 0.0, rps: 1}
