# Control plane
# ---------------------------------------------------------------------------
# A StatefulSet rather than a Deployment, because this workload owns a SQLite
# file. A Deployment with a PVC would let a rolling update run two pods against
# the same file, and SQLite does not survive that. The StatefulSet ordering
# guarantee (old pod fully terminated before the new one starts) plus a single
# replica is what makes single-writer storage safe here.
#
# Scaling past one replica means moving the store to Postgres/Timescale first -
# noted in docs/LIMITATIONS.md rather than pretended away.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-plane
  namespace: cloudops
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: cloudops-sentinel
    app.kubernetes.io/version: "1.0.0"
spec:
  serviceName: control-plane
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: cloudops-sentinel
      annotations:
        # Prometheus service discovery without a ServiceMonitor CRD, so this
        # works on a bare cluster as well as one running the operator.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Changing config should roll the pods. Without this, a ConfigMap edit
        # is silently ignored by running containers until something else
        # restarts them - a classic "I changed it and nothing happened".
        checksum/config: "replace-with-hash-in-ci"
    spec:
      serviceAccountName: cloudops-control-plane
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: control-plane
          image: cloudops/control-plane:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloudops-config
          env:
            - name: SERVICE_NAME
              value: cloudops-control-plane
            # Secrets arrive as environment variables from a Secret, never from
            # the image and never from a ConfigMap.
            - name: CLOUDOPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: CLOUDOPS_API_TOKEN
                  optional: true
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: ALERT_WEBHOOK_URL
                  optional: true
            # The downward API gives the app its own identity for log context
            # without hardcoding anything environment-specific in the image.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            # requests = what the scheduler reserves; limits = the ceiling.
            # Memory limit == request keeps the pod in the Guaranteed QoS class
            # so it is the last thing evicted under node pressure - correct for
            # the component that has to still be alive to explain the outage.
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 384Mi
          # Three distinct probes, because they answer three distinct questions.
          startupProbe:
            # Gives the first-boot backfill up to 2.5 minutes WITHOUT having to
            # slacken the liveness probe for the rest of the pod's life.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # "Is this process wedged?" Restarting is the remedy, so the check
            # must not depend on anything external - otherwise a dependency
            # outage becomes a fleet-wide restart storm.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # "Should this pod get traffic?" This one DOES check the store and
            # the collector, so a pod with no data is pulled from the Service.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config
              readOnly: true
            # readOnlyRootFilesystem means /tmp must be provided explicitly.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cloudops-inventory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: cloudops
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: cloudops-sentinel
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Honest PDB for a single-replica workload.
#
# With replicas: 1 a PDB cannot actually preserve availability - there is no
# second copy to keep serving. Setting maxUnavailable: 0 would not fix that; it
# would only make `kubectl drain` hang forever and block node upgrades, which
# is a worse failure than a 20-second monitoring gap. So this permits the
# eviction and the real remedy is recorded where it belongs: move the store off
# SQLite and run two replicas (docs/LIMITATIONS.md).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-plane
  namespace: cloudops
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
