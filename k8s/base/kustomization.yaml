# Base manifest set.
#
# Resources only - no generators. The ConfigMap holding the inventory, rate
# card and alert rules is generated by the kustomization at the repository
# root, because those files live above this directory and kustomize (rightly)
# will not read outside its own tree.
#
# Build the deployable output from the root, not from here:
#     kubectl apply -k .
#
# Applying this directory on its own leaves the control plane without its
# inventory ConfigMap, and it will fail readiness with "inventory file not
# found" - which is the correct loud failure rather than starting up empty.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-rbac.yaml
  - 20-config.yaml
  - 30-control-plane.yaml
  - 40-demo-services.yaml
  - 50-networkpolicy.yaml
