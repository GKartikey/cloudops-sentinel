# Configuration and secrets
# ---------------------------------------------------------------------------
# The split is the point: a ConfigMap is world-readable to anyone with `get
# configmaps` and shows up in plain text in `kubectl describe`. A Secret is at
# least separated by RBAC and can be encrypted at rest with an EncryptionConfig
# or replaced entirely by an external store.
#
# So: tunables here, credentials there, and NO credential is committed.

apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-config
  namespace: cloudops
data:
  ENVIRONMENT: "kubernetes"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  COLLECT_INTERVAL_SECONDS: "15"
  RETENTION_HOURS: "24"
  BACKFILL_HOURS: "6"
  ANOMALY_Z_THRESHOLD: "3.5"
  REQUIRE_TOKEN_FOR_WRITES: "true"
  CONFIG_DIR: "/app/config"
  DATA_DIR: "/data"

---
# NOTE: the `cloudops-inventory` ConfigMap is NOT defined here.
#
# The inventory and rate card are configuration, not code, so they are mounted
# rather than baked into the image - editing the estate does not mean a
# rebuild. That ConfigMap is generated by the kustomization at the repository
# root from the same config/*.yaml files docker-compose mounts, so there is
# exactly one source of truth. Build with `kubectl apply -k .` from the root.
#
# Defining a placeholder here would be worse than omitting it: it would let a
# plain `kubectl apply -f` appear to succeed while the control plane came up
# with an empty inventory.

---
# NOT A REAL SECRET.
#
# This is a template. `stringData` is empty on purpose so that applying it
# creates an empty secret rather than a working credential everyone shares.
# Create the real one out of band and never commit it:
#
#   kubectl -n cloudops create secret generic cloudops-secrets \
#     --from-literal=CLOUDOPS_API_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" \
#     --from-literal=ALERT_WEBHOOK_URL="https://hooks.example.com/..."
#
# In a real cluster prefer removing the secret from Kubernetes entirely:
#   * Azure: Workload Identity + Key Vault CSI driver
#   * AWS:   IRSA + Secrets Manager / Parameter Store CSI driver
#   * Either: External Secrets Operator syncing from the cloud secret store
# A secret that is never written into etcd cannot leak out of etcd.
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-secrets
  namespace: cloudops
  annotations:
    cloudops.io/managed-by: "create out of band - see comment above"
type: Opaque
stringData:
  CLOUDOPS_API_TOKEN: ""
  ALERT_WEBHOOK_URL: ""
